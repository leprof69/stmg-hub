# Vite sort les fichiers dans dist/ (pas build/).
[build]
  command = "npm run build && node scripts/netlify-postbuild.cjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Scan secrets après le build : timeouts / annulations observés sur ce site ; les VITE_* sont
  # dans le JS client par design — désactiver évite l’étape qui finit en "Command was cancelled".
  SECRETS_SCAN_ENABLED = "false"
