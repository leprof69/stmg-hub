# Vite sort les fichiers dans dist/ (pas build/).
[build]
  command = "npm run build && node scripts/netlify-postbuild.cjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Gros bundle Vite : evite les OOM sur les builders Linux.
  NODE_OPTIONS = "--max-old-space-size=8192"
  # Config Firebase client (VITE_*) : volontairement dans le JS — le scan Netlify sinon echec "Exposed secrets".
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_GEMINI_API_KEY,VITE_GROQ_API_KEY,VITE_DS_ACCESS_CODE"
  # Smart detection inspecte aussi le *build output* : la cle Web client dans le bundle peut declencher
  # "Exposed secrets" meme si SECRETS_SCAN_ENABLED=false (politique compte / ordre d'application).
  # Valeur deja publique cote client (voir src/services/firebase.ts).
  # Plusieurs chaines du client Firebase (fichier + bundle) peuvent declencher la smart detection.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDYkmxm99cMZBp553EQM3rH_7H1sjzHGvg,1:270987336613:web:822d940bc5365e0646664c,stmg-hub.firebasestorage.app"

# SPA : toutes les URLs servent index.html (evite 404 au rafraichissement si routes URL plus tard).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
