# Vite sort les fichiers dans dist/ (pas build/).
[build]
  command = "npm run build && node scripts/netlify-postbuild.cjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Scan secrets : desactive scan + smart detection (variables VITE_* dans le JS = faux positifs possibles).
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# SPA : toutes les URLs servent index.html (evite 404 au rafraichissement si routes URL plus tard).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
