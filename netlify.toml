# Vite sort les fichiers dans dist/ (pas build/).
[build]
  command = "npm run build && node scripts/netlify-postbuild.cjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Le nom npm "stmg-hub" = même texte que Firebase project ID ? faux positif scan secrets.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_PROJECT_ID"
