# Deploiement production : meme principe que "npx netlify-cli deploy --prod --dir=dist"
# (build sur Ubuntu GitHub, upload du dist vers Netlify).
#
# Secrets a creer sur GitHub : repo -> Settings -> Secrets and variables -> Actions
#   NETLIFY_AUTH_TOKEN  : Netlify -> User settings -> Applications -> Personal access tokens
#   NETLIFY_SITE_ID     : Site settings -> Site details -> Site ID
#
# IMPORTANT : si le site Netlify est aussi branche sur "Deploy from Git", tu peux avoir
# deux deploiements en parallele (build Netlify + ce workflow) -> annulations / conflits.
# Dans ce cas : Netlify -> Deploys -> "Pause builds" OU debrancher le repo et ne garder que ce workflow.

name: Deploy Netlify (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-prod-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build && node scripts/netlify-postbuild.cjs

      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --prod --dir=dist --message "github ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
